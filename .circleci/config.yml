# CircleCI configuration for artui.
#
# CI ONLY — fires on every branch push and PR. Lint, test, build
# sanity-check on Linux. The first step in every CI job runs
# `should-skip-ci.sh` which halts the job if the commit only touches
# docs/config files (README.md, CHANGELOG.md, .md files, docs/**,
# npm/**, cloudflare/**, .gitignore, etc.). Override with `[ci force]`
# in the commit message.
#
# Releases live on GitHub Actions in `.github/workflows/release.yml`.
# That workflow fires on `release: published` (the human-in-the-loop
# gate is publishing a GitHub Release, not a tag push). The reason:
# CI runs on every commit, releases run a few times a month — heavy
# load belongs on CircleCI's 30,000 free credits, light triggered work
# fits in GHA's 2,000 free private-repo minutes.

version: 2.1

orbs:
  win: circleci/windows@5.0

executors:
  rust-linux:
    docker:
      - image: cimg/rust:1.95
    resource_class: medium
    working_directory: ~/artui

# ── Reusable steps ───────────────────────────────────────────────────
commands:
  skip_if_docs_only:
    description: "Halt the job if the commit only touches docs/config"
    steps:
      - run:
          name: Path filter (skip docs-only changes)
          # See .circleci/should-skip-ci.sh for the full ignore list
          # and the [ci force] override semantics.
          command: bash .circleci/should-skip-ci.sh

  restore_rust_cache:
    description: "Restore cargo registry, git, and target/ caches"
    parameters:
      target:
        type: string
        default: "default"
    steps:
      - restore_cache:
          keys:
            - artui-rust-v2-{{ arch }}-<< parameters.target >>-{{ checksum "Cargo.lock" }}
            - artui-rust-v2-{{ arch }}-<< parameters.target >>-

  save_rust_cache:
    description: "Persist cargo registry, git, and target/ caches"
    parameters:
      target:
        type: string
        default: "default"
    steps:
      - save_cache:
          key: artui-rust-v2-{{ arch }}-<< parameters.target >>-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - target

# ── Jobs ─────────────────────────────────────────────────────────────
jobs:
  lint:
    executor: rust-linux
    environment:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - checkout
      - skip_if_docs_only
      - restore_rust_cache
      - run:
          name: rustfmt --check
          command: cargo fmt --all -- --check
      - run:
          name: clippy (deny warnings)
          # Default features only. The `lsp-integration` feature gates
          # an integration test that requires `rust-analyzer` on
          # $PATH; we don't install it on the CI runner, so clippy
          # excludes it here. Run locally with
          # `cargo clippy --all-targets --features lsp-integration`.
          command: cargo clippy --all-targets -- -D warnings
      - save_rust_cache

  test:
    executor: rust-linux
    environment:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - checkout
      - skip_if_docs_only
      - restore_rust_cache
      - run:
          name: cargo test
          command: cargo test --all-targets
      - save_rust_cache

  build:
    executor: rust-linux
    environment:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - checkout
      - skip_if_docs_only
      - restore_rust_cache
      - run:
          name: cargo build --release
          command: cargo build --release --all-targets
      - save_rust_cache

# ── Workflows ────────────────────────────────────────────────────────
workflows:
  ci:
    jobs:
      - lint:
          filters:
            tags:
              ignore: /.*/
      - test:
          filters:
            tags:
              ignore: /.*/
      - build:
          requires:
            - lint
            - test
          filters:
            tags:
              ignore: /.*/
