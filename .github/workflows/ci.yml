name: CI (fallback)

# CI primary lives on CircleCI — see `.circleci/config.yml`.
# CircleCI's free plan grants 30,000 credits/month (~3,000 Linux minutes),
# vs GHA's 2,000 private-repo minutes. CI runs on every push so the heavier
# load belongs there.
#
# This workflow is preserved as a manual fallback. Trigger it from the
# Actions tab when CircleCI is unavailable, or via `gh workflow run ci.yml`.
# It is NOT triggered by `push` or `pull_request`.
#
# Releases run here on GHA (`.github/workflows/release.yml`) — fires only on
# `release: published`, a few times a month, comfortably within the 2,000
# min budget.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  # Avoid canceling in-progress main runs (this caused "The operation was canceled")
  cancel-in-progress: false

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: macos-latest
            label: macOS
          - os: windows-2025-vs2026
            label: Windows
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-targets

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build release artifacts
        run: cargo build --release --all-targets
