name: Release (fallback)

# Release moved to CircleCI in v0.7.0 — see `.circleci/config.yml`
# `release` workflow. The reason: this workflow ran out of GHA minutes
# mid-publish during v0.6.0; CircleCI's free 30,000 credits/month plan
# absorbs the cross-platform matrix without that constraint.
#
# This workflow is preserved as a manual fallback. Trigger it from the
# Actions tab via "Run workflow" → enter the existing tag (e.g. v0.7.1)
# when CircleCI's release pipeline is unavailable. It is NOT triggered
# by tag push anymore, so the same `git tag vX.Y.Z && git push origin
# vX.Y.Z` flow only triggers CircleCI.
#
# To re-enable on tag push, swap the `on:` block back to the
# `push: tags: ['v*']` form (kept commented below for reference).

on:
  # push:
  #   tags:
  #     - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.7.1)"
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.display_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `display_name` is what shows up in the GitHub Actions UI —
        # human-friendly OS + arch labels so the run list reads cleanly.
        # `asset_label` is what the published archive carries in its
        # filename (e.g. `linux-x86_64`, `macos-aarch64`,
        # `windows-x86_64`) so the release page is readable to anyone
        # not steeped in Rust's target-triple convention.
        # `target` is the canonical Rust target triple — required by
        # `cargo build --target` and by `dtolnay/rust-toolchain` to
        # install the right cross-compilation toolchain. It never
        # appears in user-facing asset names.
        include:
          - display_name: Linux x86_64 (glibc)
            asset_label: linux-x86_64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - display_name: Linux aarch64 (glibc)
            asset_label: linux-aarch64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          # macOS — both targets cross-compile from the ARM runner.
          # macos-13 (Intel) runners have a tiny pool and queue for
          # 10+ minutes; macos-14 is plentiful and builds x86_64 just
          # as well via `cargo build --target`.
          - display_name: macOS x86_64 (Intel)
            asset_label: macos-x86_64
            target: x86_64-apple-darwin
            os: macos-14
            archive: tar.gz
          - display_name: macOS aarch64 (Apple Silicon)
            asset_label: macos-aarch64
            target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
          - display_name: Windows x86_64 (MSVC)
            asset_label: windows-x86_64
            target: x86_64-pc-windows-msvc
            os: windows-2025-vs2026
            archive: zip
          - display_name: Windows aarch64 (MSVC)
            asset_label: windows-aarch64
            target: aarch64-pc-windows-msvc
            os: windows-2025-vs2026
            archive: zip
    steps:
      - uses: actions/checkout@v6
        with:
          # release: published sets GITHUB_REF to the tag automatically.
          # workflow_dispatch needs an explicit ref so the matrix builds
          # the right tagged source tree.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF#refs/tags/}"
            echo "name=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (linux aarch64)
        if: matrix.cross == true
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release --target ${{ matrix.target }} --bin artui

      - name: Build
        if: matrix.cross != true
        run: cargo build --release --target ${{ matrix.target }} --bin artui

      - name: Stage artifacts (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          version="${{ steps.tag.outputs.name }}"
          version="${version#v}"
          name="artui-${version}-${{ matrix.asset_label }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/artui" "dist/${name}/artui"
          cp README.md LICENSE* "dist/${name}/" 2>/dev/null || true
          (cd dist && tar -czf "${name}.tar.gz" "${name}")
          ls dist/

      - name: Stage artifacts (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = "${{ steps.tag.outputs.name }}" -replace '^v',''
          $name = "artui-$version-${{ matrix.asset_label }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/artui.exe" "dist/$name/artui.exe"
          if (Test-Path README.md) { Copy-Item README.md "dist/$name/" }
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip" -Force
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: artui-${{ matrix.asset_label }}
          path: dist/artui-*.${{ matrix.archive }}

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Detect whether R2 secrets exist. The mirror upload step is gated
      # on this so the workflow stays green even if you haven't wired R2
      # yet (set R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY
      # in repo secrets to enable).
      - name: Probe R2 secrets
        id: r2_probe
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          if [ -n "$R2_ACCOUNT_ID" ]; then
            echo "HAS_R2=true" >> "$GITHUB_ENV"
          else
            echo "HAS_R2=false" >> "$GITHUB_ENV"
          fi

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF#refs/tags/}"
            echo "name=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute checksums
        run: |
          cd dist
          ls
          sha256sum artui-*.tar.gz artui-*.zip > checksums.sha256 || true

      # Mirror to Cloudflare R2 so installers running outside this repo
      # (e.g. friends with no collaborator access while the source repo
      # stays private) have a public, zero-auth download URL. R2 is
      # S3-compatible — the AWS CLI does the upload.
      - name: Upload assets to Cloudflare R2
        if: ${{ env.HAS_R2 == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -e
          cd dist
          for asset in artui-*.tar.gz artui-*.zip checksums.sha256; do
            [ -f "$asset" ] || continue
            # Versioned path (immutable)
            aws s3 cp "$asset" "s3://artui-releases/${TAG}/${asset}" \
              --endpoint-url "$R2_ENDPOINT" --no-progress
            # Latest pointer (overwrites every release)
            aws s3 cp "$asset" "s3://artui-releases/latest/${asset}" \
              --endpoint-url "$R2_ENDPOINT" --no-progress
          done
          echo "Uploaded artui $TAG binaries to R2."

      # Mirror the install scripts themselves so friends can fetch them
      # via curl/PowerShell without hitting raw.githubusercontent.com
      # (which 404s while the source repo is private).
      - name: Upload install scripts to Cloudflare R2
        if: ${{ env.HAS_R2 == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -e
          # Always serve the latest scripts from /install.sh and /install.ps1
          # so the canonical curl one-liner is stable across releases.
          aws s3 cp scripts/install.sh "s3://artui-releases/install.sh" \
            --endpoint-url "$R2_ENDPOINT" --content-type "text/x-shellscript" \
            --cache-control "public, max-age=300" --no-progress
          aws s3 cp scripts/install.ps1 "s3://artui-releases/install.ps1" \
            --endpoint-url "$R2_ENDPOINT" --content-type "text/plain; charset=utf-8" \
            --cache-control "public, max-age=300" --no-progress
          echo "Uploaded install scripts to R2."

      - name: Publish release with assets
        uses: softprops/action-gh-release@v3
        with:
          # Tag pushed manually from local CLI (push: tags) sets
          # github.ref to the tag; workflow_dispatch supplies it via input.
          tag_name: ${{ steps.tag.outputs.name }}
          name: artui ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            dist/artui-*.tar.gz
            dist/artui-*.zip
            dist/checksums.sha256
          fail_on_unmatched_files: false
