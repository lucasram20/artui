name: Release

on:
  # Triggered when you push a manual tag from your local CLI:
  #   git tag v0.3.5 && git push origin v0.3.5
  # Manual tag pushes are NOT subject to GitHub's
  # "default GITHUB_TOKEN cannot trigger other workflows" rule, since
  # they originate from a real user push, not from another workflow.
  push:
    tags:
      - 'v*'
  # Manual fallback for re-running the build for an existing tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.3.5)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip
            cargo_flags: --target aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          # release: published sets GITHUB_REF to the tag automatically.
          # workflow_dispatch needs an explicit ref so the matrix builds
          # the right tagged source tree.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF#refs/tags/}"
            echo "name=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (linux aarch64)
        if: matrix.cross == true
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release --target ${{ matrix.target }} --bin artui

      - name: Build
        if: matrix.cross != true
        run: cargo build --release --target ${{ matrix.target }} --bin artui

      - name: Stage artifacts (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          version="${{ steps.tag.outputs.name }}"
          version="${version#v}"
          name="artui-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/artui" "dist/${name}/artui"
          cp README.md LICENSE* "dist/${name}/" 2>/dev/null || true
          (cd dist && tar -czf "${name}.tar.gz" "${name}")
          ls dist/

      - name: Stage artifacts (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = "${{ steps.tag.outputs.name }}" -replace '^v',''
          $name = "artui-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/artui.exe" "dist/$name/artui.exe"
          if (Test-Path README.md) { Copy-Item README.md "dist/$name/" }
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip" -Force
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artui-${{ matrix.target }}
          path: dist/artui-*.${{ matrix.archive }}

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Detect whether R2 secrets exist. The mirror upload step is gated
      # on this so the workflow stays green even if you haven't wired R2
      # yet (set R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY
      # in repo secrets to enable).
      - name: Probe R2 secrets
        id: r2_probe
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          if [ -n "$R2_ACCOUNT_ID" ]; then
            echo "HAS_R2=true" >> "$GITHUB_ENV"
          else
            echo "HAS_R2=false" >> "$GITHUB_ENV"
          fi

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF#refs/tags/}"
            echo "name=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute checksums
        run: |
          cd dist
          ls
          sha256sum artui-*.tar.gz artui-*.zip > checksums.sha256 || true

      # Mirror to Cloudflare R2 so installers running outside this repo
      # (e.g. friends with no collaborator access while the source repo
      # stays private) have a public, zero-auth download URL. R2 is
      # S3-compatible — the AWS CLI does the upload.
      - name: Upload assets to Cloudflare R2
        if: ${{ env.HAS_R2 == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -e
          cd dist
          for asset in artui-*.tar.gz artui-*.zip checksums.sha256; do
            [ -f "$asset" ] || continue
            # Versioned path (immutable)
            aws s3 cp "$asset" "s3://artui-releases/${TAG}/${asset}" \
              --endpoint-url "$R2_ENDPOINT" --no-progress
            # Latest pointer (overwrites every release)
            aws s3 cp "$asset" "s3://artui-releases/latest/${asset}" \
              --endpoint-url "$R2_ENDPOINT" --no-progress
          done
          echo "Uploaded artui $TAG to R2."

      - name: Publish release with assets
        uses: softprops/action-gh-release@v2
        with:
          # Tag pushed manually from local CLI (push: tags) sets
          # github.ref to the tag; workflow_dispatch supplies it via input.
          tag_name: ${{ steps.tag.outputs.name }}
          name: artui ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            dist/artui-*.tar.gz
            dist/artui-*.zip
            dist/checksums.sha256
          fail_on_unmatched_files: false
