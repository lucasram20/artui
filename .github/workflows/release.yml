name: Release

# Builds and publishes a cross-platform release when a GitHub Release is
# published (draft → published, or pre-release → released). Three targets
# only — matches what CircleCI was doing for the same R2 install script
# coverage, plus native macOS Apple Silicon. Each release runs ~3 jobs
# wall-clock 5–10 min each; well under the 2,000 min/month free private-
# repo budget.
#
# Release flow:
#   1. git tag vX.Y.Z && git push origin vX.Y.Z   (tag the commit)
#   2. gh release create vX.Y.Z --draft           (or click in UI)
#   3. Edit release notes if you want.
#   4. gh release edit vX.Y.Z --draft=false       (or click "Publish")
#                                                  → fires this workflow
#   5. Workflow builds 3 binaries, uploads to R2, attaches to release.
#
# Pre-releases are skipped — uncheck the prerelease flag on the release
# to actually fire the build.
#
# workflow_dispatch is preserved so an existing tag can be re-run if a
# transient failure happened (e.g. R2 hiccup): Actions tab → "Run
# workflow" → enter v0.7.1 → run.
#
# Required repo secrets:
#   GITHUB_TOKEN          — automatic, no setup needed
#   R2_ACCOUNT_ID         — Cloudflare R2 account hex id
#   R2_ACCESS_KEY_ID      — R2 S3-compatible access key (32 chars)
#   R2_SECRET_ACCESS_KEY  — R2 S3-compatible secret (64 chars)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.7.1)"
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.display_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    # Skip pre-releases. The release: published event fires for both
    # full releases and the prerelease → released transition, so this
    # gate only matters for the case where someone published a release
    # with the prerelease flag still checked. Uncheck it and re-run.
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false

    strategy:
      fail-fast: false
      matrix:
        # Three platforms — same coverage as the R2 install scripts:
        #   - linux-x86_64    → curl install.sh on glibc Linux
        #   - macos-aarch64   → curl install.sh on Apple Silicon
        #   - windows-x86_64  → iwr install.ps1 on x64 Windows
        # Linux ARM, macOS Intel, and Windows ARM users build from
        # source via `cargo install --git`. The install scripts print
        # a clear message when they detect an unsupported target.
        include:
          - display_name: Linux x86_64 (glibc)
            asset_label: linux-x86_64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - display_name: macOS aarch64 (Apple Silicon)
            asset_label: macos-aarch64
            target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
          - display_name: Windows x86_64 (MSVC)
            asset_label: windows-x86_64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v6
        with:
          # release: published sets GITHUB_REF to the tag automatically.
          # workflow_dispatch needs an explicit ref so the matrix builds
          # the right tagged source tree.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF#refs/tags/}"
            echo "name=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.target }}-

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin artui

      - name: Stage artifacts (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          version="${{ steps.tag.outputs.name }}"
          version="${version#v}"
          name="artui-${version}-${{ matrix.asset_label }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/artui" "dist/${name}/artui"
          cp README.md LICENSE* "dist/${name}/" 2>/dev/null || true
          (cd dist && tar -czf "${name}.tar.gz" "${name}")
          ls dist/

      - name: Stage artifacts (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = "${{ steps.tag.outputs.name }}" -replace '^v',''
          $name = "artui-$version-${{ matrix.asset_label }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/artui.exe" "dist/$name/artui.exe"
          if (Test-Path README.md) { Copy-Item README.md "dist/$name/" }
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip" -Force
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: artui-${{ matrix.asset_label }}
          path: dist/artui-*.${{ matrix.archive }}

  release:
    name: Publish GitHub release + R2 mirror
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF#refs/tags/}"
            echo "name=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute checksums
        run: |
          cd dist
          ls
          sha256sum artui-*.tar.gz artui-*.zip > checksums.sha256 || true
          cat checksums.sha256

      # Probe R2 secrets — mirror upload is gated on this so a fork
      # without R2 wired still gets a green publish to GitHub releases.
      - name: Probe R2 secrets
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          if [ -n "$R2_ACCOUNT_ID" ]; then
            echo "HAS_R2=true" >> "$GITHUB_ENV"
          else
            echo "HAS_R2=false" >> "$GITHUB_ENV"
            echo "R2_ACCOUNT_ID secret not set — skipping R2 mirror."
          fi

      # Defensive: trim the R2 secrets in case CircleCI-style
      # whitespace-on-paste contamination ever happens here too.
      # Length-validate to catch the cfat-... vs S3-compatible-key
      # mistake before SigV4 returns the unhelpful SignatureDoesNotMatch.
      - name: Validate R2 credentials
        if: ${{ env.HAS_R2 == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -e
          aid=$(printf '%s' "$R2_ACCOUNT_ID" | tr -d ' \t\r\n')
          akid=$(printf '%s' "$R2_ACCESS_KEY_ID" | tr -d ' \t\r\n')
          ask=$(printf '%s' "$R2_SECRET_ACCESS_KEY" | tr -d ' \t\r\n')
          if [ "${#akid}" -ne 32 ]; then
            echo "::error::R2_ACCESS_KEY_ID is ${#akid} chars; expected 32 (S3-compatible token)."
            echo "Cloudflare dashboard → R2 → Manage R2 API Tokens → Create R2 API Token."
            exit 1
          fi
          if [ "${#ask}" -ne 64 ]; then
            echo "::error::R2_SECRET_ACCESS_KEY is ${#ask} chars; expected 64."
            exit 1
          fi
          echo "R2 credentials look right (akid: ${akid:0:4}…${akid: -4}, ${#akid} chars)"

      - name: Upload assets to Cloudflare R2
        if: ${{ env.HAS_R2 == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -e
          cd dist
          for asset in artui-*.tar.gz artui-*.zip checksums.sha256; do
            [ -f "$asset" ] || continue
            # Versioned path (immutable)
            aws s3 cp "$asset" "s3://artui-releases/${TAG}/${asset}" \
              --endpoint-url "$R2_ENDPOINT" --no-progress
            # Latest pointer (overwrites every release)
            aws s3 cp "$asset" "s3://artui-releases/latest/${asset}" \
              --endpoint-url "$R2_ENDPOINT" --no-progress
          done
          echo "Uploaded artui $TAG binaries to R2."

      - name: Upload install scripts to Cloudflare R2
        if: ${{ env.HAS_R2 == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -e
          aws s3 cp scripts/install.sh "s3://artui-releases/install.sh" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "text/x-shellscript" \
            --cache-control "public, max-age=300" --no-progress
          aws s3 cp scripts/install.ps1 "s3://artui-releases/install.ps1" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public, max-age=300" --no-progress
          echo "Uploaded install scripts to R2."

      - name: Attach assets to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: artui ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            dist/artui-*.tar.gz
            dist/artui-*.zip
            dist/checksums.sha256
          fail_on_unmatched_files: false
