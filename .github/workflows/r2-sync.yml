# Re-sync an existing GitHub release to the R2 mirror without rebuilding binaries.
# Use when release.yml R2 upload failed (e.g. SignatureDoesNotMatch) but GitHub assets exist.
#
# Actions → "Sync R2 mirror" → Run workflow → tag: v0.7.0
#
# Required secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY

name: Sync R2 mirror

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to mirror (e.g. v0.7.0)"
        required: true
        default: "v0.7.0"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    name: Mirror ${{ inputs.tag }} to R2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Probe R2 secrets
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ]; then
            echo "::error::R2_ACCOUNT_ID secret not set. See docs/distribution.md"
            exit 1
          fi

      - name: Sync release assets to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/sync-r2-mirror.sh
          ./scripts/sync-r2-mirror.sh "${{ inputs.tag }}"