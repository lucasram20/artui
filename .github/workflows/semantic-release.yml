name: Semantic Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  release:
    # Skip the auto-release commit semantic-release itself just pushed.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'chore(release):') }}
    name: Tag + GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install semantic-release
        run: |
          npm install --no-save \
            semantic-release@24 \
            @semantic-release/changelog@6 \
            @semantic-release/commit-analyzer@13 \
            @semantic-release/exec@6 \
            @semantic-release/git@10 \
            @semantic-release/github@10 \
            @semantic-release/release-notes-generator@14 \
            conventional-changelog-conventionalcommits@8

      - name: Run semantic-release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          # Tail STDOUT to a side file so we can grep for the published
          # version without depending on a plugin output contract.
          npx semantic-release | tee semantic-release.log
          version="$(grep -oE 'next release version is [0-9]+\.[0-9]+\.[0-9]+' semantic-release.log \
            | tail -1 | awk '{print $NF}')"
          if [ -n "$version" ]; then
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Release workflow
        # GitHub blocks the default GITHUB_TOKEN from triggering other
        # workflows. `gh workflow run` against the same token IS allowed
        # because it goes through the API as a workflow_dispatch event.
        if: steps.semrel.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f tag="${{ steps.semrel.outputs.tag }}"
