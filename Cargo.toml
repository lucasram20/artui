[package]
name = "artui"
version = "0.0.1"
edition = "2021"
default-run = "artui"

[[bin]]
name = "art"
path = "src/bin/art.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
crossterm = "0.28"
directories = "5"
futures-util = "0.3"
glob = "0.3"
ignore = "0.4"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1"
which = "7"

[dev-dependencies]
tempfile = "3"
