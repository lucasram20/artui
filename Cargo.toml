[package]
name = "artui"
version = "0.7.2"
edition = "2021"
license = "MIT"
default-run = "artui"

[[bin]]
name = "art"
path = "src/bin/art.rs"

[dependencies]
anyhow = "1"
async-lsp = { version = "0.2", features = ["client-monitor", "omni-trait", "stdio", "tokio", "tracing"] }
async-trait = "0.1"
base64 = "0.22"
crossterm = "0.28"
directories = "5"
futures-util = "0.3"
glob = "0.3"
ignore = "0.4"
lsp-types = "0.95"
rand = "0.8"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tachyonfx = "0.25"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
toml = "0.8"
tower = { version = "0.5", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1"
unicode-width = "0.2"
url = "2"
urlencoding = "2"
which = "7"
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

# Optional features
#
# `lsp-integration` enables the integration test that spawns a real
# `rust-analyzer` against a fixture crate and asserts `definition`
# resolves a known symbol. Skipped in normal CI to keep CircleCI runs
# Linux-fast and to avoid making rust-analyzer a hard CI dependency.
# Run locally with: cargo test --features lsp-integration --test lsp_integration
[features]
default = []
lsp-integration = []
