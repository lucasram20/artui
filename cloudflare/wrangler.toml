# Cloudflare Worker config for the artui freemodel relay.
#
# This Worker proxies a tightly-scoped subset of OpenAI-format requests
# through to api.freemodel.dev with the FREEMODEL_API_KEY secret injected
# server-side. End-user binaries never see the key.
#
# Deploy:
#   1. npm install (or bun install) inside cloudflare/ to pull wrangler
#   2. npx wrangler login
#   3. npx wrangler kv namespace create FREEMODEL_RATE_LIMIT
#      → copy the printed `id` into [[kv_namespaces]] below
#   4. npx wrangler secret put FREEMODEL_API_KEY    # paste the freemodel.dev key
#   5. npx wrangler deploy
#
# After deploy the relay is reachable at
#   https://artui-freemodel-relay.<your-subdomain>.workers.dev
# Update artui's `FreemodelConfig::default().base_url` (or set
# `providers.freemodel.base_url` in user config) to that URL + "/v1".

name = "artui-freemodel-relay"
main = "worker.ts"
compatibility_date = "2026-05-29"

# Make `workers.dev` routing explicit. Without this, wrangler warns about
# enabling it by default. We want it on (the artui binary points at the
# `workers.dev` URL by default), so this is just nailing down the intent.
workers_dev = true

# Preview URLs are version-specific URLs wrangler generates for each
# deployment (`<version>-<worker>.<sub>.workers.dev`). Useful for staging,
# but the artui binary always hits the stable production URL — leave them
# off to keep the surface area small.
preview_urls = false

# Observability (free tier, optional but recommended) — surfaces request
# counts, errors, and CPU time in the Cloudflare dashboard. Drop this block
# if you'd rather not send analytics.
[observability]
enabled = true

# KV namespace used for per-IP rate limiting. The `id` was created with
# `wrangler kv namespace create FREEMODEL_RATE_LIMIT`. The `binding` name
# is what the Worker reads as `env.RATE_LIMIT`.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "51d49f67fd6e416e887d89ae139d652b"

# Variables (non-secret). Tune the rate limit without redeploying secrets.
[vars]
# Upstream the relay forwards to. The artui binary always talks to the
# relay, never to this URL directly.
UPSTREAM_BASE_URL = "https://api.freemodel.dev"
# Per-IP rate limit: requests / window seconds. 60/60 = 1 req/sec sustained
# with bursts allowed by the discrete bucket.
RATE_LIMIT_REQUESTS = "60"
RATE_LIMIT_WINDOW_SECONDS = "60"
# Soft user-agent gate. Empty string = disabled. Set to a substring like
# "artui" to require the binary's User-Agent to contain it. This is a
# friction barrier, not a security boundary — easy to spoof, but keeps
# casual `curl` traffic out.
USER_AGENT_REQUIRED_SUBSTRING = "artui"
